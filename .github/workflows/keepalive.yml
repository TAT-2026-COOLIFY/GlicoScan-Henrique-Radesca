name: Keep-alive

# O plano free do Supabase pausa o projeto após 7 dias sem atividade.
# Este job acorda a API do Render e roda um SELECT 1 no Postgres a cada
# 2 dias (GET /health/db), mesmo que ninguém use o app.
# Também dá pra rodar na mão: aba Actions → Keep-alive → Run workflow.

on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pinga /health/db (com retries — o Render free demora a acordar)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 90 https://glicoscan.onrender.com/health/db; then
              echo; exit 0
            fi
            echo "tentativa $i falhou, aguardando..."; sleep 30
          done
          exit 1
